name: CI

# Validation only. No deploy, no release, no publishing (see AGENTS.md Section 6).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  tauri-build:
    name: Tauri build check
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri build -- --debug --no-bundle
        working-directory: desktop

  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  engine-format:
    name: Engine formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          files=$(git ls-files 'engine/*.cpp' 'engine/*.hpp' 'engine/*.h')
          [ -z "$files" ] || clang-format --dry-run --Werror $files

  engine-sanitizers:
    name: Engine ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: >
          cmake -S engine -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
      - run: cmake --build build-san --parallel
      - run: ctest --test-dir build-san --output-on-failure
